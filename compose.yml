name: stockroom
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockroom}
      POSTGRES_DB: stockroom_development
    volumes:
      - stockroom_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom_development"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://stockroom:${POSTGRES_PASSWORD:-stockroom}@db:5432/stockroom_development
      TEST_DATABASE_URL: postgres://stockroom:${POSTGRES_PASSWORD:-stockroom}@db:5432/stockroom_test
      FRONTEND_ORIGIN: http://localhost:5176
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Stockroom-demo-2026!}
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "bundle exec rails db:prepare db:seed && exec bundle exec rails server -b 0.0.0.0 -P /tmp/stockroom.pid"]
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://localhost:3000/up')).code == '200' ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:5176:5176"
    depends_on:
      api:
        condition: service_healthy
volumes:
  stockroom_data:
